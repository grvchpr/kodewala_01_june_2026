<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring AI Chat</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b 45%, #334155);
      color: #e2e8f0;
    }

    .chat-card {
      width: min(900px, calc(100vw - 32px));
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    header {
      padding: 24px 28px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .messages {
      height: 420px;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(15, 23, 42, 0.55);
    }

    .message {
      max-width: 80%;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #1f2937;
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .composer {
      padding: 18px 24px 24px;
      display: grid;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.95);
      color: #e2e8f0;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    textarea:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      font-size: 0.92rem;
      color: #94a3b8;
    }

    .status {
      min-height: 1.2em;
      color: #fbbf24;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="chat-card">
    <header>
      <h1>Spring AI Chat</h1>
      <p>Ask a question and the app will send it to <code>/api/chat</code>.</p>
    </header>

    <section id="messages" class="messages">
      <div class="message bot">Hello! I’m your Spring AI chat page. Type a message below to start.</div>
    </section>

    <section class="composer">
      <textarea id="message" placeholder="Ask something like: Explain Spring AI in one sentence."></textarea>
      <div class="actions">
        <span class="hint">Tip: Press <strong>Ctrl</strong> + <strong>Enter</strong> to send.</span>
        <button id="sendButton" type="button">Send</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const messagesEl = document.getElementById('messages');
    const messageEl = document.getElementById('message');
    const sendButton = document.getElementById('sendButton');
    const statusEl = document.getElementById('status');

    function appendMessage(text, role) {
      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const message = messageEl.value.trim();
      if (!message) {
        statusEl.textContent = 'Please enter a message first.';
        return;
      }

      statusEl.textContent = '';
      appendMessage(message, 'user');
      messageEl.value = '';
      sendButton.disabled = true;
      statusEl.textContent = 'Waiting for AI response...';

      try {
        const response = await fetch(`/api/chat?message=${encodeURIComponent(message)}`);
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const text = await response.text();
        appendMessage(text, 'bot');
        statusEl.textContent = '';
      } catch (error) {
        appendMessage(`Error: ${error.message}`, 'bot');
        statusEl.textContent = 'Unable to reach the chat endpoint.';
      } finally {
        sendButton.disabled = false;
        messageEl.focus();
      }
    }

    sendButton.addEventListener('click', sendMessage);
    messageEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.ctrlKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
