spring.application.name=SpringAIProject

# Spring AI is disabled by default so the app starts cleanly without credentials.
# To enable OpenAI, set:
#   export SPRING_AI_CHAT_MODEL=openai
#   export OPENAI_API_KEY=your-key
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:openai}
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Optional model override. Uncomment if you want to pin a model.
# spring.ai.openai.chat.options.model=gpt-4o-mini
